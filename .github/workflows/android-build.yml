name: Android CI

on:
  push:
    branches: [master, audit-fixes]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0"

      - name: Build debug APK and run lint
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MindFlip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
